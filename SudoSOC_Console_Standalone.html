<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SudoSOC — Security Operations Console</title>
<style>
/* ============================================================================
   SudoSOC — Design Tokens : Colors & Type (Inlined)
   Aesthetic: tactical red-on-black SOC console. Dark, precise, live telemetry.
   ============================================================================ */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* ---------------------------------------------------------------- COLORS */
  /* — Void / surfaces (black foundation) — */
  --void:        #08080A;  /* deepest app background */
  --bg:          #0B0B0E;  /* base canvas */
  --panel:       #111115;  /* card / panel surface */
  --panel-2:     #16161B;  /* elevated surface, inputs */
  --panel-3:     #1D1D23;  /* hover / raised */
  --line:        #26262E;  /* hairline borders */
  --line-soft:   #1A1A20;  /* subtle dividers */

  /* — Brand red (sampled from logo: #DB2223) — */
  --red:         #DB2223;  /* PRIMARY brand red */
  --red-bright:  #FF2E33;  /* active / glowing red */
  --red-hi:      #FF5257;  /* light red, on-dark text accent */
  --red-deep:    #8E1416;  /* pressed / deep red */
  --red-900:     #2A0C0D;  /* red-tinted dark fill */
  --red-glow:    rgba(219,34,35,0.45);
  --red-wash:    rgba(219,34,35,0.10);

  /* — Text — */
  --fg:          #F4F5F7;  /* primary text */
  --fg-2:        #C4C5CC;  /* secondary text */
  --fg-3:        #8B8B95;  /* muted / labels */
  --fg-4:        #5C5C66;  /* faint / disabled */
  --fg-on-red:   #FFFFFF;  /* text on red */

  /* — Semantic / status — */
  --critical:    #FF3B40;  /* CRITICAL / AUTO_BLOCK */
  --high:        #FF8A3D;  /* HIGH / ISOLATE */
  --medium:      #FFC53D;  /* MEDIUM / RATE_LIMIT-warn */
  --info:        #3B82F6;  /* INFO / RATE_LIMIT */
  --safe:        #25C26E;  /* NORMAL / LOG / trusted */
  --cyan:        #22D3D8;  /* encrypted-traffic / TLS accent */
  --violet:      #8B6CEF;  /* ML / model insight accent */

  /* — Status washes — */
  --critical-wash: rgba(255,59,64,0.12);
  --high-wash:     rgba(255,138,61,0.12);
  --info-wash:     rgba(59,130,246,0.12);
  --safe-wash:     rgba(37,194,110,0.12);
  --cyan-wash:     rgba(34,211,216,0.12);

  /* ---------------------------------------------------------- TYPE FAMILIES */
  --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-ui:      'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace;

  /* ---------------------------------------------------------- TYPE SCALE */
  --fs-display:  56px;  --lh-display: 1.02; --ls-display: -0.02em;
  --fs-h1:       38px;  --lh-h1:      1.08; --ls-h1:      -0.015em;
  --fs-h2:       27px;  --lh-h2:      1.15; --ls-h2:      -0.01em;
  --fs-h3:       20px;  --lh-h3:      1.25;
  --fs-body:     15px;  --lh-body:    1.55;
  --fs-sm:       13px;  --lh-sm:      1.5;
  --fs-xs:       11px;  --lh-xs:      1.45;
  --fs-mono:     13px;  --lh-mono:    1.5;
  --fs-kicker:   11px;  --ls-kicker:  0.18em;

  /* ---------------------------------------------------------- WEIGHTS */
  --w-reg: 400; --w-med: 500; --w-semi: 600; --w-bold: 700;

  /* ---------------------------------------------------------- SPACING */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px;

  /* ---------------------------------------------------------- RADII */
  --r-xs: 3px;  --r-sm: 6px;  --r-md: 10px; --r-lg: 14px;
  --r-xl: 20px; --r-pill: 999px;

  /* ---------------------------------------------------------- BORDERS */
  --bd:        1px solid var(--line);
  --bd-soft:   1px solid var(--line-soft);
  --bd-red:    1px solid var(--red);

  /* ---------------------------------------------------------- SHADOWS / GLOW */
  --sh-sm:   0 1px 2px rgba(0,0,0,0.5);
  --sh-md:   0 6px 20px rgba(0,0,0,0.55);
  --sh-lg:   0 18px 50px rgba(0,0,0,0.65);
  --glow-red:   0 0 0 1px rgba(219,34,35,0.5), 0 0 22px -2px var(--red-glow);
  --glow-soft:  0 0 28px -6px var(--red-glow);
  --inset-top:  inset 0 1px 0 rgba(255,255,255,0.04);

  /* ---------------------------------------------------------- MOTION */
  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);
  --ease-snap:  cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 130ms; --t-med: 240ms; --t-slow: 420ms;
}

/* ============================================================================
   SEMANTIC ELEMENT STYLES — apply on a .sds scope
   ============================================================================ */
.sds { color: var(--fg); font-family: var(--font-ui); font-size: var(--fs-body);
       line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }

.sds h1, .h1 { font-family: var(--font-display); font-weight: var(--w-bold);
  font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: var(--ls-h1);
  color: var(--fg); margin: 0; }
.sds h2, .h2 { font-family: var(--font-display); font-weight: var(--w-semi);
  font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: var(--ls-h2);
  color: var(--fg); margin: 0; }
.sds h3, .h3 { font-family: var(--font-display); font-weight: var(--w-semi);
  font-size: var(--fs-h3); line-height: var(--lh-h3); color: var(--fg); margin: 0; }
.display { font-family: var(--font-display); font-weight: var(--w-bold);
  font-size: var(--fs-display); line-height: var(--lh-display);
  letter-spacing: var(--ls-display); color: var(--fg); }

.sds p, .p { font-family: var(--font-ui); font-size: var(--fs-body);
  line-height: var(--lh-body); color: var(--fg-2); margin: 0; }

.kicker { font-family: var(--font-mono); font-weight: var(--w-semi);
  font-size: var(--fs-kicker); letter-spacing: var(--ls-kicker);
  text-transform: uppercase; color: var(--fg-3); }
.kicker--red { color: var(--red-hi); }

.mono, .sds code, .sds kbd { font-family: var(--font-mono);
  font-size: var(--fs-mono); line-height: var(--lh-mono);
  color: var(--fg); font-variant-numeric: tabular-nums; }
.metric { font-family: var(--font-mono); font-weight: var(--w-bold);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--fg); }

.label { font-family: var(--font-mono); font-size: var(--fs-xs);
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }

/* ============================================================================
   LAYOUT & TELEMETRY STYLES
   ============================================================================ */
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--void);overflow:hidden;}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
#bgvignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70% 90% at 78% 8%,rgba(219,34,35,.10),transparent 60%);
  animation:sds-breathe 7s var(--ease-in-out) infinite;}
@keyframes sds-breathe{0%,100%{opacity:.6;}50%{opacity:1;}}
#root{height:100vh;position:relative;z-index:1;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;}
::-webkit-scrollbar-track{background:transparent;}

@keyframes sds-pulse{0%{box-shadow:0 0 0 0 currentColor;}70%{box-shadow:0 0 0 7px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
@keyframes sds-spin{to{transform:rotate(360deg);}}
@keyframes sds-blip{0%,100%{opacity:.2;}40%{opacity:1;}}
@keyframes sds-slidein{from{opacity:0;transform:translateY(-12px);background:var(--red-wash);}to{opacity:1;transform:none;}}
.sds-slidein{animation:sds-slidein .55s var(--ease-out);}
@keyframes sds-drawer{from{transform:translateX(40px);}to{transform:none;}}
.sds-drawer{opacity:1;animation:sds-drawer .3s var(--ease-out);}
@keyframes sds-pop{from{transform:scale(.97);opacity:0;}to{transform:none;opacity:1;}}
.sds-pop{animation:sds-pop .3s var(--ease-out);}
@keyframes sds-toast{from{transform:translate(-50%,16px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
.sds-toast{animation:sds-toast .3s var(--ease-out);}
@keyframes sds-blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.sds-cursor{color:var(--red-hi);animation:sds-blink 1s step-end infinite;}
@keyframes sds-draw{to{stroke-dashoffset:0;}}
.pulse-dot{animation:sds-pulse 1.6s infinite;}
</style>
</head>

<!-- Ambient background sweep effects script -->
<script>
(function(){
  var cv=document.getElementById('bgfx'),ctx=cv.getContext('2d');
  var DPR=Math.min(2,window.devicePixelRatio||1),W=0,H=0,CELL=30,cols=0,rows=0;
  var cells=[];        // active twinkles
  var sweep=-200;      // diagonal scan position
  function resize(){
    W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);cols=Math.ceil(W/CELL);rows=Math.ceil(H/CELL);
  }
  window.addEventListener('resize',resize);resize();
  function spawn(){
    var red=Math.random()<0.34;
    cells.push({
      gx:(Math.random()*cols|0),gy:(Math.random()*rows|0),
      red:red,life:0,
      dur:900+Math.random()*2200,
      peak:red?(0.5+Math.random()*0.4):(0.18+Math.random()*0.22),
      size:red?(Math.random()<0.5?'dot':'cell'):'cell'
    });
  }
  var last=performance.now(),acc=0;
  function frame(t){
    var dt=Math.min(60,t-last);last=t;acc+=dt;
    while(acc>110){acc-=110;for(var s=0;s<3;s++)spawn();if(cells.length>180)cells.splice(0,cells.length-180);}
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,0.022)';ctx.beginPath();
    for(var x=0;x<=cols;x++){ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,H);}
    for(var y=0;y<=rows;y++){ctx.moveTo(0,y*CELL+.5);ctx.lineTo(W,y*CELL+.5);}
    ctx.stroke();
    for(var i=cells.length-1;i>=0;i--){
      var c=cells[i];c.life+=dt;var p=c.life/c.dur;
      if(p>=1){cells.splice(i,1);continue;}
      var a=Math.sin(p*Math.PI)*c.peak;
      var px=c.gx*CELL,py=c.gy*CELL;
      if(c.red){
        if(c.size==='dot'){
          ctx.fillStyle='rgba(255,46,51,'+a+')';
          ctx.beginPath();ctx.arc(px+CELL/2,py+CELL/2,2.4,0,7);ctx.fill();
          ctx.fillStyle='rgba(219,34,35,'+(a*0.22)+')';
          ctx.beginPath();ctx.arc(px+CELL/2,py+CELL/2,9,0,7);ctx.fill();
        } else {
          ctx.fillStyle='rgba(219,34,35,'+(a*0.5)+')';
          ctx.fillRect(px+3,py+3,CELL-6,CELL-6);
        }
      } else {
        ctx.fillStyle='rgba(228,230,235,'+(a*0.5)+')';
        ctx.fillRect(px+4,py+4,CELL-8,CELL-8);
      }
    }
    sweep+=dt*0.10;if(sweep>W+200)sweep=-200;
    var g=ctx.createLinearGradient(sweep-120,0,sweep+120,0);
    g.addColorStop(0,'rgba(219,34,35,0)');g.addColorStop(0.5,'rgba(219,34,35,0.05)');g.addColorStop(1,'rgba(219,34,35,0)');
    ctx.fillStyle=g;ctx.fillRect(sweep-120,0,240,H);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<!-- ============================================================================
     APPLICATION JSX SCRIPTS (INLINED & BUNDLED INTO A SINGLE COMPILING UNIT)
     ============================================================================ */ -->
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============================================================================
   1. MOCK DATA MODEL (from data.js)
   ============================================================================ */
const SOC = (function () {
  const ATTACKS = [
    { type: "SYN Flood",        sev: "critical", tier: "AUTO_BLOCK", tactic: "TA0040", tname: "Impact",          tech: "T1498.001", techn: "Direct Network Flood" },
    { type: "Port Scan",        sev: "high",     tier: "ISOLATE",    tactic: "TA0043", tname: "Reconnaissance",  tech: "T1046",     techn: "Network Service Scanning" },
    { type: "Brute Force",      sev: "high",     tier: "RATE_LIMIT", tactic: "TA0006", tname: "Credential Access", tech: "T1110",   techn: "Brute Force" },
    { type: "SQL Injection",    sev: "critical", tier: "AUTO_BLOCK", tactic: "TA0001", tname: "Initial Access",  tech: "T1190",     techn: "Exploit Public-Facing App" },
    { type: "ICMP Flood",       sev: "medium",   tier: "RATE_LIMIT", tactic: "TA0040", tname: "Impact",          tech: "T1498.001", techn: "Direct Network Flood" },
    { type: "Shell Injection",  sev: "critical", tier: "AUTO_BLOCK", tactic: "TA0002", tname: "Execution",       tech: "T1059",     techn: "Command & Scripting Interpreter" },
    { type: "Encoded PowerShell", sev: "high",   tier: "ISOLATE",    tactic: "TA0002", tname: "Execution",       tech: "T1059.001", techn: "PowerShell" },
    { type: "UDP Amplification", sev: "medium",  tier: "RATE_LIMIT", tactic: "TA0040", tname: "Impact",          tech: "T1498.002", techn: "Reflection Amplification" },
    { type: "Netcat Reverse Shell", sev: "critical", tier: "AUTO_BLOCK", tactic: "TA0011", tname: "Command & Control", tech: "T1095", techn: "Non-Application Layer Protocol" },
  ];
  const HOSTILE_IPS = ["185.220.101.4","45.83.193.7","91.240.118.9","193.27.228.13","23.129.64.217","104.244.76.13","176.10.99.200","209.141.55.26"];
  const PROTOS = ["TCP","TCP","TCP","UDP","ICMP"];
  const SUMMARIES = {
    "SYN Flood": "High-confidence SYN flood from a known Tor exit node. Maps to T1498.001 (Direct Network Flood). Recommend immediate AUTO_BLOCK and upstream rate-limit.",
    "Port Scan": "Sequential connection attempts across 1k+ ports indicate active reconnaissance. Low payload, high fan-out. Isolate source and monitor for follow-on exploitation.",
    "Brute Force": "Repeated failed auth against SSH. Credential-access pattern (T1110). Rate-limit source and enforce lockout policy.",
    "SQL Injection": "Payload contains UNION-based injection markers against a public endpoint. High severity. AUTO_BLOCK and audit the target application.",
    "ICMP Flood": "Sustained ICMP echo volume above baseline. Likely volumetric DoS attempt. Rate-limit at the edge.",
    "Shell Injection": "Command-injection signature in request body. Execution-stage threat. Block immediately and capture payload for forensics.",
    "Encoded PowerShell": "Base64-encoded PowerShell detected in flow. Obfuscated execution attempt. Isolate host and inspect process tree.",
    "UDP Amplification": "Spoofed-source UDP with large response ratio — reflection/amplification. Rate-limit and verify upstream filtering.",
    "Netcat Reverse Shell": "Outbound connection to suspicious port matches reverse-shell behavior (T1095). C2 indicator. Block and quarantine host.",
  };
  function rint(a,b){return Math.floor(a+Math.random()*(b-a+1));}
  function pick(a){return a[rint(0,a.length-1)];}
  function ip(){return "10.0.0."+rint(2,40);}
  function ts(off){const d=new Date(Date.now()-off*1000);return d.toTimeString().slice(0,8);}
  let _seq = 0;
  function makeAlert(ageSec){
    const a = pick(ATTACKS);
    const proto = pick(PROTOS);
    const conf = (a.sev==="critical"? rint(90,99): a.sev==="high"? rint(78,94): rint(62,86))/100;
    const blocked = a.tier==="AUTO_BLOCK" || (a.tier==="ISOLATE" && Math.random()>0.4);
    return {
      id: ++_seq,
      ts: ts(ageSec||0),
      severity: a.sev, attack_type: a.type, tier: a.tier,
      src_ip: pick(HOSTILE_IPS), src_port: rint(1024,65000),
      dst_ip: ip(), dst_port: pick([22,80,443,3306,8080,53,4444]),
      proto, confidence: conf, blocked,
      pkts: rint(40,52000), bytes: rint(2000,9000000),
      mitre_tactic: a.tactic, mitre_tname: a.tname, mitre_tech: a.tech, mitre_techn: a.techn,
      llm: SUMMARIES[a.type],
    };
  }
  function seed(n){ const out=[]; for(let i=0;i<n;i++) out.push(makeAlert(i*7+rint(0,5))); return out; }
  const KPI = { flows: 1284902, attacks: 3417, blocked: 3390, accuracy: 95.4, sensors: 3, pps: 12840, drift: 0.04 };
  const PROTO_DIST = [{k:"TCP",v:68},{k:"UDP",v:24},{k:"ICMP",v:6},{k:"Other",v:2}];
  const TIER_DIST = [{k:"AUTO_BLOCK",v:41,c:"#FF3B40"},{k:"ISOLATE",v:23,c:"#FF8A3D"},{k:"RATE_LIMIT",v:21,c:"#3B82F6"},{k:"LOG",v:15,c:"#25C26E"}];
  const TOP_PORTS = [{k:"443",v:920},{k:"80",v:740},{k:"22",v:610},{k:"3306",v:280},{k:"53",v:190},{k:"4444",v:120},{k:"8080",v:95}];
  const MITRE = ATTACKS.map(a=>({tech:a.tech,techn:a.techn,tactic:a.tname,n:rint(8,140)})).sort((x,y)=>y.n-x.n);
  const ENC = [
    {host:"api.stripe.com", tls:"TLS 1.3", ent:7.9, verdict:"normal"},
    {host:"185.220.101.4", tls:"TLS 1.2", ent:7.99, verdict:"suspicious"},
    {host:"cdn.cloudflare.com", tls:"TLS 1.3", ent:7.7, verdict:"normal"},
    {host:"unknown-c2.xyz", tls:"TLS 1.0", ent:7.98, verdict:"suspicious"},
    {host:"login.microsoft.com", tls:"TLS 1.3", ent:7.6, verdict:"normal"},
  ];
  return { ATTACKS, makeAlert, seed, KPI, PROTO_DIST, TIER_DIST, TOP_PORTS, MITRE, ENC, fmtBytes, };
  function fmtBytes(b){ if(b>1e6) return (b/1e6).toFixed(1)+" MB"; if(b>1e3) return (b/1e3).toFixed(1)+" KB"; return b+" B"; }
})();

/* ============================================================================
   2. SHARED UI PRIMITIVES (from ui.jsx)
   ============================================================================ */
function Icon({ name, size = 16, color, style, className }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const el = document.createElement("i");
      el.setAttribute("data-lucide", name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { width: size, height: size }, nameAttr: "data-lucide" });
    }
  }, [name, size]);
  return <span ref={ref} className={className}
    style={{ display: "inline-flex", color: color || "currentColor", lineHeight: 0, ...style }} />;
}

function Kicker({ children, red, style }) {
  return <span className={"kicker" + (red ? " kicker--red" : "")} style={style}>{children}</span>;
}

function StatusDot({ color = "var(--red)", pulse, size = 8 }) {
  return <span style={{
    width: size, height: size, borderRadius: 999, background: color, display: "inline-block",
    flex: "none", boxShadow: pulse ? `0 0 0 0 ${color}` : "none",
    animation: pulse ? "sds-pulse 1.6s infinite" : "none",
  }} data-dot-color={color} />;
}

const SEV = {
  critical: { c: "#FF6B6F", dot: "#FF3B40", wash: "rgba(255,59,64,.12)", bd: "rgba(255,59,64,.3)" },
  high:     { c: "#FFA266", dot: "#FF8A3D", wash: "rgba(255,138,61,.12)", bd: "rgba(255,138,61,.3)" },
  medium:   { c: "#FFD466", dot: "#FFC53D", wash: "rgba(255,197,61,.12)", bd: "rgba(255,197,61,.3)" },
  info:     { c: "#7FACF8", dot: "#3B82F6", wash: "rgba(59,130,246,.12)", bd: "rgba(59,130,246,.3)" },
  safe:     { c: "#5AD494", dot: "#25C26E", wash: "rgba(37,194,110,.12)", bd: "rgba(37,194,110,.3)" },
};

function Badge({ sev = "info", children, dot }) {
  const s = SEV[sev] || SEV.info;
  return <span style={{
    fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 600, letterSpacing: ".07em",
    textTransform: "uppercase", padding: "4px 9px", borderRadius: "var(--r-xs)",
    background: s.wash, color: s.c, border: `1px solid ${s.bd}`,
    display: "inline-flex", alignItems: "center", gap: 7, whiteSpace: "nowrap",
  }}>
    {dot && <StatusDot color={s.dot} size={6} />}{children}
  </span>;
}

function Button({ children, variant = "primary", icon, onClick, style, type }) {
  const [hover, setHover] = useState(false);
  const base = {

function CountUp({ to, dur = 1300, fmt }) {
  const [v, setV] = useState(0);
  const ref = useRef();
  useEffect(() => {
    const t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      setV(to * e);
      if (k < 1) ref.current = requestAnimationFrame(step);
    }
    ref.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(ref.current);
  }, [to]);
  return <>{fmt ? fmt(v) : Math.round(v).toLocaleString()}</>;
}

function Donut({ data, size = 132, thick = 16, center }) {
  const total = data.reduce((s, d) => s + d.v, 0);
  const r = (size - thick) / 2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  const [grow, setGrow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setGrow(true), 80); return () => clearTimeout(t); }, []);
  return <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)", flex: "none" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--panel-3)" strokeWidth={thick} />
      {data.map((d, i) => {
        const frac = d.v / total;
        const dash = grow ? C * frac : 0;
        const seg = <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
          stroke={d.c || "var(--red)"} strokeWidth={thick}
          strokeDasharray={`${dash} ${C}`} strokeDashoffset={-acc}
          style={{ transition: "stroke-dasharray .9s var(--ease-out)" }} />;
        acc += C * frac;
        return seg;
      })}
    </svg>
    <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
      {center}
      {data.map((d, i) => <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <StatusDot color={d.c || "var(--red)"} size={8} />
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--fg-2)", minWidth: 96 }}>{d.k}</span>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--fg-3)" }}>{d.v}%</span>
      </div>)}
    </div>
  </div>;
}

/* ============================================================================
   6. FLOW PREDICTOR VERDICT VIEW (from Predict.jsx)
   ============================================================================ */
function Field({ label, value, onChange, type = "text", options }) {
  const [focus, setFocus] = useState(false);
  const common = {
    fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--fg)", background: "var(--panel-2)",
    border: `1px solid ${focus ? "var(--red)" : "var(--line)"}`, borderRadius: "var(--r-sm)",
    padding: "10px 12px", outline: "none", width: "100%", boxSizing: "border-box",
    boxShadow: focus ? "0 0 0 3px var(--red-wash)" : "none", transition: "all var(--t-fast)",
  };
  return <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
    <Kicker>{label}</Kicker>
    {options
      ? <select value={value} onChange={e => onChange(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={common}>
          {options.map(o => <option key={o}>{o}</option>)}</select>
      : <input value={value} onChange={e => onChange(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={common} />}
  </label>;
}

function Verdict({ r }) {
  const [w, setW] = useState(0);
  useEffect(() => { setW(0); const t = setTimeout(() => setW(r.conf * 100), 120); return () => clearTimeout(t); }, [r]);
  const accent = r.hostile ? "var(--red)" : "var(--safe)";
  const accentHi = r.hostile ? "var(--red-hi)" : "#5AD494";
  return <section className="sds-pop" style={{
    background: "var(--panel)", border: `1px solid ${r.hostile ? "rgba(219,34,35,.45)" : "rgba(37,194,110,.4)"}`,
    borderRadius: "var(--r-lg)", boxShadow: r.hostile ? "var(--glow-soft)" : "none", overflow: "hidden",
  }}>
    <div style={{ height: 4, background: accent }} />
    <div style={{ padding: 20 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <Icon name={r.hostile ? "shield-alert" : "shield-check"} size={26} color={accentHi} />
        <div>
          <div className="h2" style={{ fontSize: 22, color: accentHi }}>{r.verdict}</div>
          <Kicker>predicted class · {r.cls}</Kicker>
        </div>
      </div>
      <div style={{ marginTop: 18 }}>
        <div style={{ display: "flex", justifycontent: "space-between", fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--fg-3)", marginBottom: 6 }}>
          <span>MODEL CONFIDENCE</span><b style={{ color: accentHi, fontSize: 13 }}>{(r.conf * 100).toFixed(0)}%</b>
        </div>
        <div style={{ height: 8, background: "var(--panel-3)", borderRadius: 999, overflow: "hidden" }}>
          <div style={{ height: "100%", width: w + "%", background: accent, borderRadius: 999, transition: "width 1.2s var(--ease-out)" }} />
        </div>
      </div>
      <div style={{ marginTop: 18 }}>
        <Kicker>class probabilities</Kicker>
        <div style={{ marginTop: 8 }}>
          {r.probs.map(p => <BarRow key={p.k} label={p.k} value={Math.max(0, Math.round(p.v * 100))} max={100}
            color={p.k === r.cls ? accent : "var(--panel-3)"} suffix="%" />)}
        </div>
      </div>
    </div>
  </section>;
}

function Predict() {
  const [f, setF] = useState({ src: "185.220.101.4", dst: "10.0.0.12", dport: "80", proto: "TCP", pkts: "48210", ent: "7.9" });
  const [result, setResult] = useState(null);
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  function run() {
    const ent = parseFloat(f.ent) || 0;
    const hostile = ent > 7.5 || ["4444","31337"].includes(f.dport) || parseInt(f.pkts) > 10000;
    const conf = hostile ? 0.9 + Math.random() * 0.09 : 0.55 + Math.random() * 0.25;
    setResult(null);
    setTimeout(() => setResult({
      verdict: hostile ? "ATTACK DETECTED" : "NORMAL TRAFFIC", hostile, conf,
      cls: hostile ? "SYN Flood" : "Benign",
      probs: hostile
        ? [{ k: "SYN Flood", v: conf }, { k: "DoS", v: 0.04 }, { k: "Port Scan", v: 0.03 }, { k: "Normal", v: 1 - conf - 0.07 }]
        : [{ k: "Normal", v: conf }, { k: "Trusted Agency", v: 0.18 }, { k: "Port Scan", v: 0.06 }, { k: "DoS", v: 1 - conf - 0.24 }],
    }), 120);
  }
  return <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, alignItems: "start" }}>
    <Panel title="Real-time flow prediction" kicker="3-layer hybrid engine" icon="zap">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <Field label="Source IP" value={f.src} onChange={set("src")} />
        <Field label="Destination IP" value={f.dst} onChange={set("dst")} />
        <Field label="Destination port" value={f.dport} onChange={set("dport")} />
        <Field label="Protocol" value={f.proto} onChange={set("proto")} options={["TCP", "UDP", "ICMP"]} />
        <Field label="Packets" value={f.pkts} onChange={set("pkts")} />
        <Field label="Payload entropy" value={f.ent} onChange={set("ent")} />
      </div>
      <Button icon="search-code" onClick={run} style={{ marginTop: 16, width: "100%", justifyContent: "center" }}>Predict verdict</Button>
    </Panel>
    <div>
      {!result && <Panel style={{ minHeight: 280 }} bodyStyle={{ display: "grid", placeItems: "center", minHeight: 280 }}>
        <div style={{ textAlign: "center", color: "var(--fg-4)" }}>
          <Icon name="scan-search" size={34} />
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, marginTop: 12 }}>Enter flow details and run a prediction.</div>
        </div>
      </Panel>}
      {result && <Verdict r={result} />}
    </div>
  </div>;
}

function MitreView() {

      <span style={{ fontFamily: "var(--font-ui)", fontSize: 13, color: "var(--fg-2)" }}>Flagged <b style={{ color: "var(--fg)" }}>without decryption</b> — entropy + packet-timing + connection-behavior signatures.</span>

    <div>

/* ============================================================================
   8. MAIN CONTROLLER APP SHELL (from app.jsx)
   ============================================================================ */
function App() {
  const [view, setView] = useState("overview");
  const [live, setLive] = useState(true);
  const [alerts, setAlerts] = useState(() => SOC.seed(7));
  const [selected, setSelected] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!live) return;
    const t = setInterval(() => {
      setAlerts(prev => [SOC.makeAlert(0), ...prev].slice(0, 14));
    }, 3200);
    return () => clearInterval(t);
  }, [live]);

  function action(msg) {
    setSelected(null);
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }

  return <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: "transparent", position: "relative" }}>
    <TopBar live={live} onToggleLive={() => setLive(l => !l)} />
    <div style={{ display: "flex", flex: 1, overflow: "hidden", position: "relative" }}>
      <LeftRail view={view} setView={setView} />
      <main style={{ flex: 1, overflowY: "auto", padding: 18, position: "relative" }}>
        <div style={{ marginBottom: 16, display: "flex", alignItems: "baseline", justifycontent: "space-between" }}>
          <div>
            <Kicker red>{TITLE[view].k}</Kicker>
            <h1 className="h1" style={{ fontSize: 28, marginTop: 4 }}>{TITLE[view].t}</h1>
          </div>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--fg-4)" }}>{new Date().toISOString().slice(0, 10)} · UTC</span>
        </div>
        {view === "overview" && <Overview alerts={alerts} live={live} selected={selected} onSelect={setSelected} />}
        {view === "analytics" && <Analytics />}
        {view === "predict" && <Predict />}
        {view === "intel" && <IntelTabs />}
      </main>
      {view === "overview" && <AlertDrawer a={selected} onClose={() => setSelected(null)} onAction={action} />}
    </div>
    {toast && <div className="sds-toast" style={{
      position: "absolute", bottom: 22, left: "50%", transform: "translateX(-50%)", zIndex: 50,
      background: "var(--panel)", border: "1px solid var(--red)", borderRadius: "var(--r-md)",
      padding: "12px 18px", boxShadow: "var(--glow-soft)", display: "flex", alignItems: "center", gap: 10,
      fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--fg)",
    }}>
      <Icon name="check-circle-2" size={16} color="var(--red-hi)" />{toast}
      <span style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--fg-4)", marginLeft: 4 }}>· iptables updated</span>
    </div>}
  </div>;
}

const TITLE = {
  overview: { k: "Security Operations", t: "Overview" },
  analytics: { k: "Network telemetry", t: "Flow Analytics" },
  predict: { k: "Hybrid engine", t: "Real-time Prediction" },

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
