```yml
title: Port Scan Detection
status: test
description: Detects port scans from a single source IP
references:
  - https://example.com/port-scan-detection
logsource:
  product: linux
  service: netfilter
detection:
  selection:
    src_ip: 192.168.56.99
    dest_port: 15
  condition: selection | count(dest_port) by src_ip > 15 and span(0.9s)
filter:
  - src_ip: 192.168.56.1
fields:
  - src_ip
  - dest_port
  - count
falsepositives:
  - Legitimate network scanning from admin tools
level: medium
```