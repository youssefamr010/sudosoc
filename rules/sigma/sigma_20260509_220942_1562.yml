```yml
title: GUESS_PASSWD Detection
status: test
description: Detects potential password guessing attacks
references:
  - https://example.com/guess-passwd
logsource:
  product: webserver
  service: http
detection:
  selection:
    src_ip: 172.64.149.20
    src_port: 443
    dest_ip: 192.168.100.5
    dest_port: 64545
    protocol: tcp
  condition: selection
fields:
  - src_ip
  - src_port
  - dest_ip
  - dest_port
  - protocol
falsepositives:
  - Unknown
level: medium
```