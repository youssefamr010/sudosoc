```yml
title: Suspicious NetBIOS Name Service Traffic
status: test
description: Detects suspicious NetBIOS Name Service traffic
references:
  - https://en.wikipedia.org/wiki/NetBIOS
logsource:
  product: linux
  service: udp
detection:
  selection:
    src_ip: 192.168.56.1
    src_port: 137
    dest_ip: 192.168.56.255
    dest_port: 137
    proto: udp
  condition: selection
fields:
  - src_ip
  - src_port
  - dest_ip
  - dest_port
  - proto
falsepositives:
  - Unknown
level: low
```