<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--void);}
  .wrap{padding:22px 26px;display:flex;flex-direction:column;gap:14px;}
  .scale{display:flex;flex-direction:column;gap:8px;}
  .r{display:flex;align-items:center;gap:14px;}
  .bar{height:14px;background:linear-gradient(90deg,var(--red),var(--red-deep));border-radius:3px;}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:96px;}
  .lab b{color:var(--fg);}
</style></head>
<body class="sds"><div class="wrap">
  <div class="kicker kicker--red">Spacing — 4pt base scale</div>
  <div class="scale">
    <div class="r"><span class="lab"><b>sp-1</b> · 4</span><div class="bar" style="width:4px"></div></div>
    <div class="r"><span class="lab"><b>sp-2</b> · 8</span><div class="bar" style="width:8px"></div></div>
    <div class="r"><span class="lab"><b>sp-3</b> · 12</span><div class="bar" style="width:12px"></div></div>
    <div class="r"><span class="lab"><b>sp-4</b> · 16</span><div class="bar" style="width:16px"></div></div>
    <div class="r"><span class="lab"><b>sp-6</b> · 24</span><div class="bar" style="width:24px"></div></div>
    <div class="r"><span class="lab"><b>sp-8</b> · 32</span><div class="bar" style="width:32px"></div></div>
    <div class="r"><span class="lab"><b>sp-12</b> · 48</span><div class="bar" style="width:48px"></div></div>
    <div class="r"><span class="lab"><b>sp-16</b> · 64</span><div class="bar" style="width:64px"></div></div>
  </div>
</div></body></html>
