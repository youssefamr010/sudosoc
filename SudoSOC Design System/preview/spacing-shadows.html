<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--void);}
  .wrap{padding:26px;display:flex;gap:20px;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .box{width:118px;height:64px;background:var(--panel);border:var(--bd);border-radius:var(--r-md);
       display:flex;align-items:center;justify-content:center;}
  .box.red{border:1px solid var(--red);}
  .pulse{animation:pl 2.4s var(--ease-in-out) infinite;}
  @keyframes pl{0%,100%{box-shadow:0 0 0 1px rgba(219,34,35,.5),0 0 22px -2px rgba(219,34,35,.25);}50%{box-shadow:0 0 0 1px rgba(219,34,35,.7),0 0 30px 0 rgba(219,34,35,.55);}}
  .nm{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-2);font-weight:600;}
  .dot{width:12px;height:12px;border-radius:999px;background:var(--red);}
</style></head>
<body class="sds"><div class="wrap">
  <div style="width:100%" class="kicker kicker--red">Shadows &amp; Glow — elevation is light, not weight</div>
  <div class="item"><div class="box" style="box-shadow:var(--sh-sm)"></div><div class="nm">sh-sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--sh-md)"></div><div class="nm">sh-md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--sh-lg)"></div><div class="nm">sh-lg</div></div>
  <div class="item"><div class="box red" style="box-shadow:var(--glow-soft)"></div><div class="nm">glow-soft</div></div>
  <div class="item"><div class="box red pulse"><span class="dot"></span></div><div class="nm">glow-red · live</div></div>
</div></body></html>
